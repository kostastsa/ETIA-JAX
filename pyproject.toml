[project]
name = "etia-jax"
version = "0.1.0"
description = "Pure-JAX port of ETIA (automated causal discovery)"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["jax", "genjax", "blackjax", "optax", "numpy", "pandas", "networkx", "scipy"]

[project.optional-dependencies]
test = ["pytest", "causal-learn"]  # causal-learn: test-only reference

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etia_jax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long exact checks (run with -m slow)"]
addopts = "-m 'not slow'"
